[package]
name = "hwc-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Network games for the Homeworld: Cataclysm recreation: lockstep turns of player orders, a host and its clients over TCP, the lobby and finding games on the local network"

[dependencies]
hwc-sim = { path = "../hwc-sim" }
hwc-formats = { path = "../hwc-formats" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"

[dev-dependencies]
hwc-math = { path = "../hwc-math" }
