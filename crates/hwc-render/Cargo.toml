[package]
name = "hwc-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Real-time wgpu renderer for Homeworld: Cataclysm ships, lighting and backgrounds"

[dependencies]
hwc-formats = { path = "../hwc-formats" }
wgpu = "30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[dev-dependencies]
png = "0.18"
