[package]
name = "hwc-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Front-end manager (menu system) of Homeworld: Cataclysm: .fib screens, region tree, UI controls, textured frames, fonts, options"

[dependencies]
hwc-formats = { path = "../hwc-formats" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
pollster = "0.4"
# Rasterises the modern HUD's system font (Segoe UI, read at run time; no font is shipped).
ab_glyph = "0.2.32"
