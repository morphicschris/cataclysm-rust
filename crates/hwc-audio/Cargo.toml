[package]
name = "hwc-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Homeworld: Cataclysm audio engine: the original mixer, sound events, speech and music"

[features]
default = ["output"]
# Real-time playback through cpal. The mixer, events and offline rendering work without it.
output = ["dep:cpal"]

[dependencies]
hwc-formats = { path = "../hwc-formats" }
cpal = { version = "0.18.2", optional = true }

[[example]]
name = "jukebox"
required-features = ["output"]
