[package]
name = "cataclysm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Homeworld: Cataclysm recreation: the game executable"

[dependencies]
hwc-formats = { path = "../../crates/hwc-formats" }
hwc-ui = { path = "../../crates/hwc-ui" }
wgpu = { version = "30", features = ["counters"] }
winit = "0.30"
pollster = "0.4"
hwc-audio = { path = "../../crates/hwc-audio" }
hwc-video = { path = "../../crates/hwc-video" }
hwc-render = { path = "../../crates/hwc-render" }
hwc-sim = { path = "../../crates/hwc-sim" }
hwc-fx = { path = "../../crates/hwc-fx" }
hwc-kas = { path = "../../crates/hwc-kas" }
hwc-math = { path = "../../crates/hwc-math" }
hwc-nis = { path = "../../crates/hwc-nis" }
glam = "0.30"
jpeg-decoder = { version = "0.3", default-features = false }
